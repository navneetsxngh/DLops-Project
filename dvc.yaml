stages:
  data_ingestion:
    cmd: set PYTHONPATH=. && python src/pipeline/dataingestion_pipeline.py
    deps:
      - src/pipeline/dataingestion_pipeline.py
      - config/config.yaml
    outs:
      - artifacts/data_ingestion/Chicken-fecal-images

  prepare_base_model:
    cmd: set PYTHONPATH=. && python src/pipeline/prepare_base_model.py
    deps:
      - src/pipeline/prepare_base_model.py
      - config/config.yaml
    params:
      - IMAGE_SIZE
      - INCLUDE_TOP
      - CLASSES
      - WEIGHTS
      - LEARNING_RATE
    outs:
      - artifacts/prepare_base_model

  training:
    cmd: set PYTHONPATH=. && python src/pipeline/training_pipeline.py
    deps:
      - src/pipeline/training_pipeline.py
      - src/components/prepare_callbacks.py
      - config/config.yaml
      - artifacts/data_ingestion/Chicken-fecal-images
      - artifacts/prepare_base_model
    params:
      - IMAGE_SIZE
      - EPOCHS
      - BATCH_SIZE
      - AUGMENTATION
      - LEARNING_RATE
    outs:
      - artifacts/training/model.h5

  evaluation:
    cmd: set PYTHONPATH=. && python src/pipeline/evaluation_pipeline.py
    deps:
      - src/pipeline/evaluation_pipeline.py
      - config/config.yaml
      - artifacts/data_ingestion/Chicken-fecal-images
      - artifacts/training/model.h5
    params:
      - IMAGE_SIZE
      - BATCH_SIZE
    metrics:
      - scores.json:
          cache: false